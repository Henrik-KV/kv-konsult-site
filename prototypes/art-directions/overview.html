  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #171717; color: white; font-family: Arial, sans-serif; }

    article > img:last-of-type { border-left: 1px solid #4b4b4b; }
    h2 { position: absolute; z-index: 2; left: 12px; bottom: 10px; margin: 0; padding: 7px 10px; background: #111; color: #fff; font-size: 15px; }
    p { position: fixed; z-index: 4; top: 10px; left: 50%; transform: translateX(-50%); margin: 0; padding: 7px 12px; border: 1px solid #666; border-radius: 999px; background: #171717; font-size: 12px; }
  </style>
</head>
